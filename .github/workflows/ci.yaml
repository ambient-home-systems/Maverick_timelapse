name: Validate app
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
  image:
    needs: tests
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: maverick_timelapse
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ needs.tests.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=maverick-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=maverick-${{ matrix.arch }}

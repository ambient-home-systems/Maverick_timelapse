name: Publish app images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
  build:
    needs: tests
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: maverick_timelapse
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ needs.tests.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: ${{ needs.tests.outputs.image }}:${{ needs.tests.outputs.version }}-${{ matrix.arch }}
          push: true
          cache-from: type=gha,scope=maverick-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=maverick-${{ matrix.arch }}
      - name: Verify published image on its native architecture
        env:
          IMAGE: ${{ needs.tests.outputs.image }}:${{ needs.tests.outputs.version }}-${{ matrix.arch }}
          VERSION: ${{ needs.tests.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$IMAGE"
          test "$(docker inspect --format '{{ index .Config.Labels "io.hass.version" }}' "$IMAGE")" = "$VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "io.hass.arch" }}' "$IMAGE")" = "$ARCH"
          docker run --rm --entrypoint python "$IMAGE" -c '
          from app.main import app
          import json, subprocess
          subprocess.run(["ffmpeg", "-v", "error", "-f", "lavfi", "-i", "color=size=1920x1080:rate=30", "-frames:v", "2", "-c:v", "libx264", "-threads", "2", "-pix_fmt", "yuv420p", "/tmp/check.mp4"], check=True)
          result = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries", "stream=codec_name,width,height,nb_frames", "-of", "json", "/tmp/check.mp4"]))["streams"][0]
          assert result == {"codec_name": "h264", "width": 1920, "height": 1080, "nb_frames": "2"}, result
          '
  manifest:
    needs: [tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version manifest for both architectures
        env:
          IMAGE: ${{ needs.tests.outputs.image }}
          VERSION: ${{ needs.tests.outputs.version }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-aarch64"
      - name: Verify anonymous Home Assistant downloads
        env:
          IMAGE: ${{ needs.tests.outputs.image }}
          VERSION: ${{ needs.tests.outputs.version }}
        run: python .github/scripts/verify-public-image.py "$IMAGE" "$VERSION"
